<!DOCTYPE html>

<html>

<head>

 <title></title>

 <style>

  * {margin: 0;}

  ul,li,ol {list-style: none; margin: 0; padding: 0;}



  #slidewrap {width: 1000px; height: 350px; margin: 50px auto; position: relative; overflow: hidden;}



  .slide {width: 3000px; } /*이미지 3장이 가로로 일렬*/

  .slide li {width: 1000px; height: 350px; float: left;} /*옆으로 나열*/

  .slide li img {width: 100%; height: 100%;}


/*position: absolute;를 쓰면 내가 원하는 위치에 딱 고정돼서 배치가능함 (뒤에 위치마다 값을주면)*/
  p {position: absolute; top:50%; left: 50%; text-align: center; background-color:#fff; transform: translate(-50%, -50%); 

   width: 350px; border-radius: 10px; height: 60px; line-height: 60px; opacity: 0.8;}



 span {position: absolute; top:50%; display: block; font-size: 38px; color:#fff; line-height: 40px; 

         background: rgba(0,0,0,0.6); cursor: pointer; height: 50px; transform: translateY(-50%); }

 span:hover {background: rgba(255,255,255,0.8); color:#000;}



  .prev {left:0; border-radius: 0 10px 10px 0px; padding:10px;}

  .next {right:0; border-radius: 10px 0px 0px 10px; padding:10px;}



 </style>



<script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.4.0.min.js"></script>





</head>

<body>

 <div id="slidewrap">

  <ul class="slide">

      <li><img src="https://images.unsplash.com/photo-1575721697801-937774cc44ab?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1350&q=80" alt="slide image"></li>

      <li><img src="https://images.unsplash.com/photo-1503197979108-c824168d51a8?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjExMjU4fQ&auto=format&fit=crop&w=1491&q=80" alt="slide image"></li>

      <li><img src="https://images.unsplash.com/photo-1507496380922-d75b080daf03?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1267&q=80"  alt="slide image"></li>

  </ul>

  <p>이전, 다음버튼으로 제어하는 오토 슬라이드</p>

  <span class="prev">&lt;</span>
  <span class="next">&gt;</span>

 </div>

 

 <script>

  /*이전 슬라이드 보기*/
  function prev(){
  /*.silde 안에 있는 <li> 중 마지막 이미지(slide)를 맨 앞으로 가져옴, 순서를 바꿔서 이전 이미지가 */
   $('.slide li:last').prependTo('.slide');
  /*첫번째 슬라이드를 왼쪽으로 1000px 밀어놓음, 이러면 화면에 두번째 슬라이드가 보이는 상태처럼 만들어짐(살짝 속임수!)*/
   $('.slide').css('margin-left',-1000);    // $('.slide').css({marginLeft:-1000}); 
  /*margin-left를 0으로 부드럽게 되돌림, 이전 슬라이드가 자연스럽게 왼쪽에서 들어오는 애니메이션처럼 보임, 800은 애니메이션 속도(0.8초)*/
   $('.slide').stop().animate({marginLeft:0},800);

  }


  /*다음 슬라이드 보기*/
  function next(){
  /*.slide 전체를 왼쪽으로 1000px 애니메이션으로 이동시킴, 다음 슬라이드가 화면으로 들어오는 효과과*/
   $('.slide').stop().animate({marginLeft:-1000}, function(){ //이미지의 너비가 1000px라서 
  /*애니메이션 끝나면, 앞에 있던 첫번째 슬라이드를 맨 뒤로 보냄, 순서를 바꿔줘야 무한 슬라이드가 되는것 !!*/
    $('.slide li:first').appendTo('.slide');
  /*다시 슬라이드 위치를 margin-left:0으로 돌려놓음, 그래야 다음 애니메이션이 제대로 작동*/
    $('.slide').css({marginLeft:0});

   });

  }


  /*자동 슬라이드 -> 부드럽게 계속 반복되는 원리리*/
  function slide(){
  /*margin-left를 -1000px로 슬라이드를 왼쪽으로 밀기 시작, stop()은 만약 이전 애니메이션이 진행중이면 그걸 멈추고 새로운 애니메이션 시작함함*/
   $('.slide').stop().animate({marginLeft:-1000}, function(){
    /*애니메이션이 끝나면, 첫번째 이미지를 맨 뒤로 보냄(appendTo)*/
      $('.slide li:first').appendTo('.slide');
    /*marginleft를 다시 0px로 설정하여, 슬라이드가 다시 원래 위치로 돌아오게 함함*/
      $('.slide').css({marginLeft:0});

   });

  }


  /*slide() 함수를 3초마다 자동으로 실행, slide함수가 3초 간격으로 호출되면서, 이미지가 자동으로 왼쪽으로 슬라이드됨됨*/
  setInterval(slide, 3000);
  /*이전(prev)버튼을 클릭하면, prev()함수가 실행됨*/
  $('.prev').click(function(){
    /*마지막 이미지를 맨 앞으로 이동, 슬라이드를 왼쪽으로 밀어 이전 이미지를 보여줌*/
     prev();

  });
  /*다음(next)버튼을 클릭하면, next()함수가 실행*/
  $('.next').click(function(){
  /*next()함수는 슬라이드를 왼쪽으로 밀고, 첫번째 이미지를 맨 뒤로 보내서 다음 이미지를 보여줌줌*/
    next();

  });

</script>

</body>

</html>
