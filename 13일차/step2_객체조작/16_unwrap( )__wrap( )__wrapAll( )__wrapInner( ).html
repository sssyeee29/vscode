<!DOCTYPE html>
<html >
<head>
<meta charset="utf-8" />
<title> 객체 조작 및 생성 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
 $(function(){
  $("strong").unwrap(); //strong을 감싸고 있는 부모 태그 제거-> h1이 사라지는것것 
  $(".ct1").wrap("<div />"); //#ct1을 감싸고 있는 p태그 앞에 div태그를 개별로 감쌈쌈
  $(".ct2").wrapAll("<div />"); //#ct2를 한꺼번에 div태그로 감싸버릶릶
  $("li").wrapInner("<h3 />"); //요소 내부의 내용을 감쌈 -> <li><h3>이렇게 감쌈 
 });
</script>
<style>
   div{background-color:aqua;}
</style>
</head>
<body>
   <h1 id="tit_1"><strong>객체 조작 및 생성</strong></h1>
   <p class="ct1">내용1</p>
   <p class="ct1">내용2</p>
   <p class="ct2">내용3</p>
   <p class="ct2">내용4</p>
   <ul>
      <li>내용3</li>
      <li>내용4</li>
   </ul>
</body>
</html>
