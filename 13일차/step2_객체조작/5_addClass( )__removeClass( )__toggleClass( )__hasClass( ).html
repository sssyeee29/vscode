<!DOCTYPE html>
<html>
<head>
<meta  charset="utf-8" />
<title> 객체 조작 및 생성 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<style>
   .aqua{background-color:aqua;}
   .red{background-color:red;}
   .green{background-color:green;}
   .yellow{background-color:yellow;}
</style>
<script>
$(function(){
   $("#p1").addClass("aqua"); //배경색 aqua 추가 
   $("#p2").removeClass("red"); //red 클래스 삭제
   $("#p3").toggleClass("green"); //toggleClass 클래스가 있으면 제거, 없으면 추가 -> #p3은 원래 초록이 없어서 추가됨됨
   $("#p4").toggleClass("green"); //초록 배경이 있었는데 제거함
   $("#p6").text($("#p5").hasClass("yellow")); //#p5요소에 "yellow" 클래스가 있는지 확인 후 결과(true 또는 false)를 #p6에 글자로 출력력
});
</script>
</head>
<body>
   <p id="p1">내용1</p>
   <p id="p2" class="red">내용2</p>
   <p id="p3">내용3</p>
   <p id="p4" class="green">내용4</p>
   <p id="p5" class="yellow">내용5</p>
   <p id="p6"></p>
</body>
</html>
