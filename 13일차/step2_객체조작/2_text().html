<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title> 객체 조작 및 생성 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
$(function(){
  $("h2").text("텍스트 메서드"); //<h2> 모든 요소를 선택후 text()의 내용을 변경함 
                                //.html()은 HTML 태그를 인식하지만, .text()는 글자 그대로 넣음  
  alert($("h1").text()); //<h1> 요소의 텍스트 내용만 추출해서 경고창으로 보여줌
});
</script>
</head>
<body>
<h1>객체 조작 및 생성</h1>
<h2>text()</h2>
</body>
</html>
