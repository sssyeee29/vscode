<!DOCTYPE html >
<html >
<head>
<meta charset="utf-8" />
<title> 객체 조작 및 생성 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
  //어떤 요소의 위치를 가져오는 방법을 보여주는 예제 
 $(function(){
   var top1=$("#box").position().top;
   $("#t1").text(top1);

   var top2=$("#box").offset().top;
   $("#t2").text(top2);
 });
</script>

<style>
  *{margin:0;padding:0;}
  #wrap{width:300px;height:200px;background-color:#ccc;
  position:relative; top:50px;margin:0 auto;} /*position:relative; -> 안의 #box가 위치 기준으로 삼게 됨, top 50은 wrap 자체가 아래로 50px 내려가있는것것*/

  #box{width:50px;height:50px;background-color:aqua;
  position:absolute; top:50px;left:100px;} 
</style>
</head>

<body>
<p id="t1"></p>
<p id="t2"></p>
<div id="wrap"> <!--바깥 박스-->
   <p id="box">박스1</p> <!--안쪽 박스-->
</div>
</body>
</html>
