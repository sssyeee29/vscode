<!DOCTYPE html >
<html >
<head>
<meta charset="utf-8" />
<title> 객체 조작 및 생성 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script >

 $(function(){
   $("#line_1").empty(); //요소 안의 내용만 지우고 요소 자체는 남겨둠 
   $("#line_2").remove(); // 요소 자체를 완전 제거함. 즉 <li>태그 다 없어짐 . 태그가 없으니 css도 적용안돼서 사라지는것 
 });

</script>
<style type="text/css">
#line_1{background-color:yellow;}
#line_2{background-color:orange;}
</style>
</head>
<body>
   <ul>
      <li id="line_1">내용1</li>
      <li id="line_2">내용2</li>
   </ul>
</body>
</html>
