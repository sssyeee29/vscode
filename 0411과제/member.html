<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
		
        *{margin: 0; box-sizing: border-box;}
       
        body{height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
		
		/*중앙에 박스 역할*/
        .wrapper {
  				border: none;                        /* 테두리 없음 */
 				border-radius: 20px;                 /* 둥근 모서리 */
  				padding: 30px;                       /* 내부 여백 */
  				box-shadow: 0 4px 20px rgba(0,0,0,0.1);  /* 부드러운 그림자 */
  				background: linear-gradient(to bottom right, #a1c4fd, #c2e9fb);  /* 그라데이션 배경 */
				}
        
        h2{margin: 30px 0; text-align: center;}

        table{margin:0 auto; margin-top: 0; text-align: center; justify-content: center; border-spacing: 30px;}
        
    </style>
</head>

<body>
    <div class="wrapper">
	<h2>회원 정보 입력</h2>
	
	<form method="post" action="02_addMember.jsp">
		<table>
			<tr> 
				<td>이름</td>
				<td><input type="text" name="name" size="20"></td>
			</tr>
			<tr> 
				<td>아이디</td>
				<td><input type="text" name="userid" size="20"></td>
			</tr>
			<tr> 
				<td>비밀번호</td>
				<td><input type="password" name="pwd" size="20"></td>
			</tr>
			<tr>
				<td>이메일</td>
				<td><input type="email" name="email" size="20"></td>
			</tr>
			<tr> 
				<td>전화번호</td>
				<td><input type="text" name="phone" size="20"></td>
			</tr>
			<tr> 
				<td>등급</td>
				<td>
					<input type="radio" name="admin" value="1">관리자 
					<input type="radio" name="admin" value="0" checked>일반회원 
				</td>
			</tr>
			<tr>
				<td colspan="2" align="center">
					<input type="submit" value="전송">
					&nbsp;&nbsp;&nbsp;&nbsp;
					<input type="reset" value="취소">
				</td>
			</tr>
		</table>
	</form>
</div>
</body>
</html>
