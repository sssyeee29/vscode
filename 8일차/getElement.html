<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">title</h1>
    <p class="text">text-1</p>
    <p class="text">text-2</p>

    <script>
        //id 속성값이 title인 요소 노드 1개 선택하기
        const el = document.getElementById("title");
        console.log(el);
        console.log(el.textContent); // title값만 출력가능 
        el.innerHTML="sample"; // 문자를 바꿀 수 있음 
        console.log(el.textContent);

        //class 속성값이 text인 요소 노드 모두 선택하기 
        const classE1 = document.getElementsByClassName("text");
        console.log(classE1);
        console.log(classE1[0].textContent); // 몇번째 찍을건지 적어줘야함 0을 찍으면  text-1이 나옴옴 

        //p 태그에 해당하는 요소 노드 모두 선택하기 
        const tagE1s = document.getElementsByTagName("p");
        console.log(tagE1s);
        console.log(tagE1s[0].textContent);

    </script>
</body>
</html>
