<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title> 선택자 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
$(function(){
      $("h1").css("background-color", "aqua");
      $("li:first-of-type").css("background-color","yellow");
      $("li:last-of-type").css("background-color","pink");
      //가운데 선택하는 타입은 없음.. function써서 해야하는데 .. 움.. 
   });
</script>
</head>
<body>
   <h1>탐색 선택자</h1>
   <ul>
      <li>내용1</li>
      <li>내용2</li>
      <li>내용3</li>
   </ul>
   <ul>
      <li>내용4</li>
      <li>내용5</li>
      <li>내용6</li>
   </ul>
</body>
</html>
