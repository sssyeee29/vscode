<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title> 선택자 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
$(function(){
   //a[] : []안에 있는 속성을 가진 <a> 태그만 선택하겠다는 의미
  $("a[title]").css("background-color","yellow");
  $("a[href='http://www.nate.com']").css("background-color","pink");
  $("a[href^='mailto']").css("background-color","aqua"); //^는 입력값의 시작이 mailto인것에 대한 속성
  $("a[href$='net']").css("background-color","purple"); //$는 맨끝이 net으로 끝나는것에 대한 속성
  $("a[href*='google']").css("background-color","orange"); //*는 google 단어가 있으면 속성을 준다.(어디에 있던 속성적용가능) 
});
</script>
</head>
<body>
   <h1>탐색 선택자</h1>
   <ul>
      <li>
         <a href="http://www.naver.com" title="네이버 이동">네이버</a>
      </li>
      <li><a href="mailto:ciycc@naver.com">관리자에게</a></li>
      <li><a href="http://www.nate.com">네이트</a></li>
      <li><a href="http://www.daum.net">다음</a></li>
      <li><a href="http://www.google.com">구글</a></li>
   </ul>
</body>
</html>
