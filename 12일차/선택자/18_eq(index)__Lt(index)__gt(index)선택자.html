<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title> 선택자 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
$(function(){
  $("li:eq(3)").css("background-color","yellow");//인덱스가 3인 li 하나만 선택->4번째 li 선택됨
  $("li:lt(3)").css("background-color","pink");//lt는 "less than" -> 인덱스 3보다 작은 li들 인덱스 0~2에 속성
  $("li:gt(3)").css("background-color","aqua");//gt는 "greater than" -> 인덱스 3보다 큰 li들 (4~ ) 선택됨
});

</script>
</head>
<body>
   <h1>탐색 선택자</h1>
   <ul>
      <li>내용1</li>
      <li>내용2</li>
      <li>내용3</li>
      <li>내용4</li>
      <li>내용5</li>
      <li>내용6</li>
   </ul>
</body>
</html>
