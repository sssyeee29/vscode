<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title> 선택자 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
$(function(){
  $("#second + li").css("border","1px solid red"); // +li가 바로 다음 형제 중 li요소를 선택하겠다는 의미 
   $("#second").next().next().css("background-color" , "green"); // 이렇게 하면 다다음 형제요소 선택
});
</script>
</head>
<body>
   <h1>인접 관계 선택자</h1>
   <ul>
      <li>내용1</li>
      <li id="second">내용2</li>
      <li>내용3</li>
      <li>내용4</li>
   </ul>
</body>
</html>
