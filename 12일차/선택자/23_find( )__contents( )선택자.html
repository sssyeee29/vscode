<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title> 선택자 </title>
<style>
#menu li{margin:5px 0;}
</style>
<script src="js/jquery-3.2.0.min.js"></script>
<script type="text/javascript">

   $(function(){
     $("li").filter(".st1").css("background-color","yellow");
     //모든 li요소에서 filter가 .st1인 것만 골라내서 효과적용
     $("li").contents().css("border","1px solid red");
     //모든 li요소 선택 -> 각 li요소 안에 있는 내용들을 전부 선택(텍스트 노드, 자식태그포함)해서 효과적용 
      //.children() vs .contents()
      //.children() : 자식요소들(태그만) 선택
      //.contents() : 자식요소  + 텍스트노드까지 전부 선택 
   });

</script>
</head>
<body>
<h1>탐색 선택자</h1>
<ul>
   <li class="st1">내용1</li>
   <li>
      <span><strong>내용2</strong></span> <!--내용2가 텍스트 노트!-->
   </li>
   <li class="st1">내용3</li>
</ul>
</body>
</html>
