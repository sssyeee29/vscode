<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title> 선택자 </title>
<script src="js/jquery-3.2.0.min.js"></script>
<script>
$(function(){
      $("p:visible").css("border","1px solid red"); //화면에 보여지는 <p>요소만 선택 
      $("p:hidden").css("display","block");
      //이 코드가 실행되는 순간, 숨겨져 있던 <p>가 block으로 바뀌어서 화면에 표시되는것
         //눈 깜짝할 사이에 바뀌어서 보이는 것처럼 착각이 드는것 
   });
</script>
</head>
<body>
   <h1>탐색 선택자</h1>
   <p>내용1</p>
   <p style="display: none;">내용2</p>
</body>
</html>
